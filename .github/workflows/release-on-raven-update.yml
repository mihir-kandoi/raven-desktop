name: Release on Raven update

on:
  push:
    branches: [main]
    paths: [raven]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the test build as a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: raven-desktop-release
  cancel-in-progress: false

jobs:
  metadata:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      raven_sha: ${{ steps.release.outputs.raven_sha }}
      raven_short_sha: ${{ steps.release.outputs.raven_short_sha }}
      release_name: ${{ steps.release.outputs.release_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - id: release
        name: Set release metadata
        shell: bash
        run: |
          desktop_version="$(node --print "require('./package.json').version")"
          base_version="${desktop_version%%[-+]*}"
          raven_sha="$(git -C raven rev-parse HEAD)"
          raven_short_sha="${raven_sha:0:8}"
          release_version="${base_version}-raven.${raven_short_sha}.${GITHUB_RUN_NUMBER}"
          {
            echo "raven_sha=${raven_sha}"
            echo "raven_short_sha=${raven_short_sha}"
            echo "release_name=Raven Desktop ${release_version}"
            echo "release_tag=v${release_version}"
            echo "release_version=${release_version}"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: yarn test
      - run: yarn typecheck

  build:
    name: Build (${{ matrix.platform }})
    needs: [metadata, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Set application version
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        shell: bash
        run: npm version "$RELEASE_VERSION" --no-git-tag-version
      - name: Build installers
        run: yarn make
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            out/make/**/*.deb
            out/make/**/*.dmg
            out/make/**/*.exe
            out/make/**/*.rpm
            out/make/**/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: github.event_name == 'push' || inputs.publish
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          checksum_file="$RUNNER_TEMP/SHA256SUMS"
          find release-assets -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            filename="$(basename "$file")"
            (cd "$directory" && sha256sum "$filename")
          done > "$checksum_file"
          mv "$checksum_file" release-assets/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RAVEN_SHA: ${{ needs.metadata.outputs.raven_sha }}
          RAVEN_SHORT_SHA: ${{ needs.metadata.outputs.raven_short_sha }}
          RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          This release uses Raven commit [\`${RAVEN_SHORT_SHA}\`](https://github.com/mihir-kandoi/raven/commit/${RAVEN_SHA}).

          Downloads:

          - macOS: DMG and ZIP
          - Windows: EXE
          - Linux: DEB and RPM

          The macOS app uses an ad-hoc signature. Apple has not notarized this build.
          EOF
          mapfile -d '' release_assets < <(find release-assets -type f -print0 | sort -z)
          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --latest \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME"
